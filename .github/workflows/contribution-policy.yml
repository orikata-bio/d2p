name: Contribution policy
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: contribution-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  disclosure:
    name: Validate contribution disclosure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Metadata only: never check out or execute a contributor's code here.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            function missingSections(body) {
              const clean = (body || '').replace(/<!--[\s\S]*?-->/g, '').replace(/```[\s\S]*?```/g, '[code block]');
              const sections = new Map();
              let active = null;
              for (const line of clean.split(/\r?\n/)) {
                const heading = /^##\s+(.+?)\s*#*\s*$/.exec(line);
                if (heading) { active = heading[1].trim().toLowerCase(); if (!sections.has(active)) sections.set(active, []); }
                else if (active) sections.get(active).push(line);
              }
              return ['Summary','Human contribution','Agent contribution','External sources','Validation'].filter(name => {
                const value = (sections.get(name.toLowerCase()) || []).join('\n').trim();
                return !value || /^(?:TBD|TODO|N\/A|\[?replace.*|Describe .*|List .*|State .*|Identify .*|Explain .*)[.\s]*$/i.test(value);
              });
            }
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
            const missing = missingSections(pr.body);
            await github.rest.repos.createCommitStatus({ owner, repo, sha: pr.head.sha,
              state: missing.length ? 'failure' : 'success', context: 'Contribution disclosure',
              description: missing.length ? 'Complete: ' + missing.join(', ').slice(0, 120) : 'Required authorship, sources and validation disclosed',
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}` });
            if (missing.length) core.setFailed('Complete PR sections: ' + missing.join(', '));
