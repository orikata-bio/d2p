# Generated from the first-party contribution-policy.mjs; no candidate checkout.
name: Contribution policy
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: contribution-policy-${{ github.repository }}
  cancel-in-progress: false
  queue: max
jobs:
  disclosure:
    name: Validate contribution disclosure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {execFileSync} = require('node:child_process');
            const htmlParser = "\nimport json, sys, unicodedata\nfrom html.parser import HTMLParser\n\nnames = ['Summary', 'Human contribution', 'Agent contribution', 'External sources', 'Validation']\nprompts = {\n    'describe the change and why it is needed.',\n    'list the commands and environments used to test it.',\n    'describe the problem and resulting behavior.',\n    'identify the accountable human and their design, coding, review and validation work.',\n    'list each agent/tool/model when known, tasks, autonomy, and human verification. state none if unused.',\n    'list code/reference urls, exact revisions, licenses, affected files and how sources were used. state none if applicable.',\n    'list exact commands, environments, results, and meaningful untested cases.',\n}\nvoids = {'area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input', 'link', 'meta', 'param', 'source', 'track', 'wbr'}\n\ndef clean(value):\n    return ' '.join(''.join(c for c in value if c.isspace() or unicodedata.category(c)[0] != 'C').split())\n\nclass Sections(HTMLParser):\n    def __init__(self):\n        super().__init__(convert_charrefs=True)\n        self.sections = {}\n        self.active = None\n        self.heading = None\n        self.ignored = []\n\n    def handle_starttag(self, tag, attrs):\n        if self.ignored:\n            if tag not in voids:\n                self.ignored.append(tag)\n            return\n        if tag in {'script', 'style', 'template', 'head'} or any(k == 'hidden' for k, v in attrs):\n            if tag not in voids:\n                self.ignored.append(tag)\n            return\n        if tag == 'h2':\n            self.active = None\n            self.heading = []\n        elif tag == 'h1':\n            self.active = None\n        elif tag in {'p', 'div', 'br', 'li', 'pre', 'blockquote', 'tr', 'td', 'th', 'h3', 'h4', 'h5', 'h6'}:\n            self.handle_data(' ')\n\n    def handle_endtag(self, tag):\n        if self.ignored:\n            if tag in self.ignored:\n                del self.ignored[len(self.ignored) - 1 - self.ignored[::-1].index(tag):]\n            return\n        if tag == 'h2' and self.heading is not None:\n            self.active = clean(''.join(self.heading)).casefold()\n            self.sections.setdefault(self.active, [])\n            self.heading = None\n        elif tag in {'p', 'div', 'li', 'pre', 'blockquote', 'tr', 'td', 'th', 'h3', 'h4', 'h5', 'h6'}:\n            self.handle_data(' ')\n\n    def handle_data(self, data):\n        if self.ignored:\n            return\n        if self.heading is not None:\n            self.heading.append(data)\n        elif self.active is not None:\n            self.sections[self.active].append(data)\n\nparser = Sections()\nparser.feed(sys.stdin.read())\nparser.close()\nmissing = []\nfor name in names:\n    value = clean(''.join(parser.sections.get(name.casefold(), [])))\n    folded = value.casefold()\n    if not value or folded.rstrip('.') in {'todo', 'tbd', 'n/a'} or folded in prompts or (folded.startswith('[replace') and folded.rstrip('.').endswith(']')):\n        missing.append(name)\nprint(json.dumps(missing))\n";
            function missingSections(html) {
              if (typeof html !== 'string' || Buffer.byteLength(html) > 1024 * 1024) {
                throw Error('Missing or oversized GitHub-rendered disclosure body.');
              }
              return JSON.parse(execFileSync('python3', ['-I', '-c', htmlParser], {
                input: html, encoding: 'utf8', timeout: 10000, maxBuffer: 65536,
              }));
            }
            function incompletePulls(pulls, head) {
              const unique = new Map(pulls.filter(p => p.state === 'open' && p.head?.sha === head).map(p => [p.number, p]));
              return [...unique.values()].map(p => ({number: p.number, missing: missingSections(p.body_html === null ? '' : p.body_html)}))
                .filter(p => p.missing.length).sort((a, b) => a.number - b.number);
            }
            async function openPulls(github, owner, repo) {
              const rows = [];
              for (let page = 1; page <= 10; page++) {
                // Commit association omits open companions once a SHA is on main.
                const {data, headers} = await github.rest.pulls.list({owner, repo, state: 'open', per_page: 100, page,
                  headers: {accept: 'application/vnd.github.full+json'}});
                rows.push(...data);
                if (!headers.link?.includes('rel="next"')) return rows;
              }
              throw Error('Too many open PRs; disclosure validation requires maintainer inspection.');
            }
            async function checkDisclosure(github, context, core) {
              const {owner, repo} = context.repo;
              const heads = new Set(), failures = [];
              const target_url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              const write = (sha, state, description) => github.rest.repos.createCommitStatus({owner, repo, sha, state,
                context: 'Contribution disclosure', description, target_url});
              const pending = async sha => {
                if (!/^[0-9a-f]{40}$/.test(sha || '') || heads.has(sha)) return;
                heads.add(sha);
                try { await write(sha, 'pending', 'Revalidating current PR disclosures'); }
                catch (error) { failures.push(error); }
              };
              // Invalidate every event/current head before lookups can fail. A moved PR
              // also revalidates companions remaining at its previous SHA. Unrelated heads
              // are not rewritten on every event, preserving GitHub's per-SHA status quota.
              await pending(context.payload?.pull_request?.head?.sha);
              await pending(context.payload?.before);
              if (failures.length) throw failures[0];
              const {data: current} = await github.rest.pulls.get({owner, repo, pull_number: context.issue.number,
                headers: {accept: 'application/vnd.github.full+json'}});
              await pending(current.head?.sha);
              if (failures.length) throw failures[0];
              const related = await openPulls(github, owner, repo);
              const pulls = [...related.filter(p => p.number !== current.number), current];
              for (const sha of heads) {
                try {
                  const incomplete = incompletePulls(pulls, sha);
                  if (sha === current.head?.sha && incomplete.length) {
                    core.setFailed(incomplete.map(p => '#' + p.number + ': ' + p.missing.join(', ')).join('\n'));
                  }
                  await write(sha, incomplete.length ? 'failure' : 'success', incomplete.length
                    ? ('Complete disclosures in PRs: ' + incomplete.map(p => '#' + p.number).join(', ')).slice(0, 140)
                    : 'All open PRs at this head disclose authorship, sources and validation');
                } catch (error) { failures.push(error); }
              }
              if (failures.length) throw failures[0];
            }
            await checkDisclosure(github,context,core);
