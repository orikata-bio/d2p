[build-system]
# Build dependencies - only needed when building from source, not when installing wheels
requires = [
    "meson-python>=0.15.0",
    "meson>=1.2.0",
    "ninja",
    "torch>=2.0",  # Needed at build time to find PyTorch includes
]
build-backend = "mesonpy"

[project]
name = "py-d2p"
version = "0.1.0"
description = "Differentiable Dynamic Programming operators for PyTorch on CPU and CUDA"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["pytorch", "dynamic-programming", "differentiable", "cpu", "cuda", "alignment", "parsing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist",
]

[project.urls]
Homepage = "https://github.com/orikata-bio/d2p"
Repository = "https://github.com/orikata-bio/d2p"

[tool.meson-python.args]
# CPU-only source builds use:
# python -m pip install . --no-build-isolation --config-settings=setup-args=-Dcuda=disabled
setup = ["-Dbuildtype=release"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
